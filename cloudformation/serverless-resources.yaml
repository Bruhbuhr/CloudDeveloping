AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  Prefix:
    Type: String
    Description: Prefix for naming resources
  Env:
    Type: String
    Description: Environment (e.g., dev, prod)
  Role:
    Type: String
    Description: IAM role resources

Resources:
  # Messaging/Notification
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub "Ticketery"
      FifoTopic: False
      Tags: 
        - Key: Name
          Value: !Sub "${Prefix}-${Env}-app-notification"
      TopicName: !Sub "${Prefix}-${Env}-app-notification"

  # SNS Topic Policy to allow access from LabRole
  SNSPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SNSTopic
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "__default_statement_ID",
              "Effect": "Allow",
              "Principal": {
                "AWS": "*"
              },
              "Action": [
                "SNS:GetTopicAttributes",
                "SNS:SetTopicAttributes",
                "SNS:AddPermission",
                "SNS:RemovePermission",
                "SNS:DeleteTopic",
                "SNS:Subscribe",
                "SNS:ListSubscriptionsByTopic",
                "SNS:Publish"
              ],
              "Resource": "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Prefix}-${Env}-app-notification",
              "Condition": {
                "StringEquals": {
                  "aws:SourceOwner": "${AWS::AccountId}"
                }
              }
            },
            {
              "Effect": "Allow",
              "Principal": {
                "Service": [
                  "states.amazonaws.com",
                  "lambda.amazonaws.com"
                ]
              },
              "Action": [
                "SNS:GetTopicAttributes",
                "SNS:SetTopicAttributes",
                "SNS:AddPermission",
                "SNS:RemovePermission",
                "SNS:DeleteTopic",
                "SNS:Subscribe",
                "SNS:ListSubscriptionsByTopic",
                "SNS:Publish"
              ],
              "Resource": "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Prefix}-${Env}-app-notification"
            }
          ]
        }

  # Step Functions State Machine for SNS subscription with email validation
  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${Prefix}-${Env}-topic-subscription"
      RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Role}"
      StateMachineType: EXPRESS
      DefinitionString: !Sub |
        {
          "Comment": "State Machine to handle SNS subscription",
          "StartAt": "ValidateInput",
          "States": {
            "ValidateInput": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.email",
                  "StringMatches": "*@*.*",
                  "Next": "CheckSubscriptionStatus"
                }
              ],
              "Default": "InvalidInput"
            },
            "CheckSubscriptionStatus": {
              "Type": "Task",
              "Resource": "arn:aws:lambda:ap-southeast-1:879654127886:function:asm3-test-check-subscription",
              "ResultPath": "$.subscriptionStatus",
              "Next": "SubscriptionDecision"
            },
            "SubscriptionDecision": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.subscriptionStatus.body.status",
                  "StringEquals": "SUCCESS",
                  "Next": "SubscriptionConfirmed"
                },
                {
                  "Variable": "$.subscriptionStatus.body.status",
                  "StringEquals": "FAIL",
                  "Next": "SubscriptionFailed"
                }
              ]
            },
            "SubscriptionConfirmed": {
              "Type": "Succeed",
              "OutputPath": "$.subscriptionStatus.body"
            },
            "SubscriptionFailed": {
              "Type": "Succeed",
              "OutputPath": "$.subscriptionStatus.body"
            },
            "InvalidInput": {
              "Type": "Fail",
              "Error": "InvalidInputError",
              "Cause": "Invalid email address provided."
            }
          }
        }

  # Lambda function to check if a user is subscribed to SNS topic
  CheckSubscriptionLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Prefix}-${Env}-check-subscription"
      Runtime: python3.9
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Role}"
      Handler: index.lambda_handler
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          
          sns = boto3.client('sns')
          
          def lambda_handler(event, context):
              try:
                  email = event['email']
                  topic_arn = os.environ['SNS_TOPIC_ARN']
          
                  response = sns.list_subscriptions_by_topic(
                      TopicArn=topic_arn
                  )
          
                  for subscription in response['Subscriptions']:
                      if subscription['Endpoint'] == email:
                          if subscription['SubscriptionArn'] == 'PendingConfirmation':
                              return {
                                  "statusCode": 200,
                                  "body": {"status": "FAIL", "reason": "Subscription is not confirmed"}
                              }
                          elif subscription['SubscriptionArn'] == 'Deleted':
                              return {
                                  "statusCode": 200,
                                  "body": {"status": "FAIL", "reason": "Subscription is deleted"}
                              }
                          else:
                              return {
                                  "statusCode": 200,
                                  "body": {"status": "SUCCESS"}
                              }
          
                  # Email not found in the topic's subscriptions
                  return {
                      "statusCode": 200,
                      "body": {"status": "FAIL", "reason": "Email not subscribed"}
                  }
          
              except Exception as e:
                  return {
                      "statusCode": 500,
                      "body": json.dumps({"error": str(e)})
                  }
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref SNSTopic
      Timeout: 10

  # Grant permission for API Gateway to invoke the Lambda function
  LambdaSNSTopicCheckingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CheckSubscriptionLambdaFunction.Arn
      Action: "lambda:InvokeFunction"
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*"

  # Lambda function to send OTP
  OTPLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Prefix}-${Env}-send-otp"
      Runtime: python3.9
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Role}"
      Handler: index.lambda_handler
      Code:
        ZipFile: |
          import boto3
          import json
          import os

          sns = boto3.client('sns')

          def lambda_handler(event, context):
              try:
                  body = json.loads(event['body'])
                  email = body.get('email')
                  otp = body.get('otp')

                  if not email or not otp:
                      return {
                          "statusCode": 400,
                          "headers": {
                              "Access-Control-Allow-Origin": "*"
                          },
                          "body": json.dumps({"error": "Missing email or otp in request"})
                      }

                  message = f"Your OTP is: {otp}"
                  response = sns.publish(
                      TopicArn=os.environ['SNS_TOPIC_ARN'],
                      Message=message,
                      Subject="Your OTP Code",
                      MessageAttributes={
                          'email': {
                              'DataType': 'String',
                              'StringValue': email
                          }
                      }
                  )

                  return {
                      "statusCode": 200,
                      "headers": {
                          "Access-Control-Allow-Origin": "*"
                      },
                      "body": json.dumps({"message": "OTP sent successfully", "response": response})
                  }
              except Exception as e:
                  return {
                      "statusCode": 500,
                      "headers": {
                          "Access-Control-Allow-Origin": "*"
                      },
                      "body": json.dumps({"error": str(e)})
                  }
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref SNSTopic
      Timeout: 10

  # Grant SNS publish permissions to the Lambda function
  LambdaSNSTopicPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt OTPLambdaFunction.Arn
      Action: "lambda:InvokeFunction"
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*"

  # New S3 Bucket for Storing Event Images
  EventBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-${Env}-event-images"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedHeaders:
              - "*"
            MaxAge: 3000
      Tags:
        - Key: Name
          Value: !Sub "${Prefix}-${Env}-event-images"

  # Bucket Policy
  EventBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EventBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowPublicReadAccess
            Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${Prefix}-${Env}-event-images/*"
          - Sid: AllowLambdaToUpload
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Role}"
            Action: "s3:PutObject"
            Resource: !Sub "arn:aws:s3:::${Prefix}-${Env}-event-images/*"

  # Lambda function to handle event image uploads
  EventCreationLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Prefix}-${Env}-upload-event-image"
      Runtime: python3.9
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Role}"
      Handler: index.lambda_handler
      Code:
        ZipFile: |
          import boto3
          import json
          import base64
          import os
          
          s3 = boto3.client('s3')
          
          def lambda_handler(event, context):
              try:
                  body = json.loads(event['body'])
                  image_data = body.get('image')
                  event_id = body.get('event_id')
                  
                  if not image_data or not event_id:
                      return {
                          "statusCode": 400,
                          "body": json.dumps({"error": "Missing image data or event ID"})
                      }
                  
                  # Decode the base64 image data
                  image_bytes = base64.b64decode(image_data)
                  file_name = f"{event_id}/image.png"
                  
                  # Upload the image to S3
                  s3.put_object(
                      Bucket=os.environ['EVENT_IMAGE_BUCKET'],
                      Key=file_name,
                      Body=image_bytes,
                      ContentType='image/png'
                  )
                  
                  return {
                      "statusCode": 200,
                      "body": json.dumps({"message": "Image uploaded successfully", "image_url": f"s3://{os.environ['EVENT_IMAGE_BUCKET']}/{file_name}"})
                  }
              except Exception as e:
                  return {
                      "statusCode": 500,
                      "body": json.dumps({"error": str(e)})
                  }
      Environment:
        Variables:
          EVENT_IMAGE_BUCKET: !Ref EventBucket
      Timeout: 10

  # Grant permission for API Gateway to invoke the Lambda function
  LambdaImageUploadPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt EventCreationLambdaFunction.Arn
      Action: "lambda:InvokeFunction"
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*"

  # Lambda function to handle ticket QR code uploads
  TicketCreationLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Prefix}-${Env}-upload-ticket-qr"
      Runtime: python3.9
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Role}"
      Handler: index.lambda_handler
      Code:
        ZipFile: |
          import boto3
          import json
          import base64
          import os
          
          s3 = boto3.client('s3')
          
          def lambda_handler(event, context):
              try:
                  body = json.loads(event['body'])
                  image_data = body.get('image')
                  event_id = body.get('event_id')
                  user_id = body.get('user_id')
                  
                  if not image_data or not event_id or not user_id:
                      return {
                          "statusCode": 400,
                          "body": json.dumps({"error": "Missing QR code or event ID or user ID"})
                      }
                  
                  # Decode the base64 image data
                  image_bytes = base64.b64decode(image_data)
                  file_name = f"{event_id}/tickets/{user_id}/image.png"
                  
                  # Upload the image to S3
                  s3.put_object(
                      Bucket=os.environ['EVENT_IMAGE_BUCKET'],
                      Key=file_name,
                      Body=image_bytes,
                      ContentType='image/png'
                  )
                  
                  return {
                      "statusCode": 200,
                      "body": json.dumps({"message": "Image uploaded successfully", "image_url": f"s3://{os.environ['EVENT_IMAGE_BUCKET']}/{file_name}"})
                  }
              except Exception as e:
                  return {
                      "statusCode": 500,
                      "body": json.dumps({"error": str(e)})
                  }
      Environment:
        Variables:
          EVENT_IMAGE_BUCKET: !Ref EventBucket
      Timeout: 10

  # Grant permission for API Gateway to invoke the Lambda function
  LambdaTicketUploadPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt TicketCreationLambdaFunction.Arn
      Action: "lambda:InvokeFunction"
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*"

  # Pre-Signed URL creation
  TicketPresignedUrlLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Prefix}-${Env}-get-ticket-presigned-url"
      Runtime: python3.9
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Role}"
      Handler: index.lambda_handler
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          
          s3 = boto3.client('s3')
          
          def lambda_handler(event, context):
              try:
                  # Parse the input parameters
                  body = json.loads(event['body'])
                  user_id = body.get('user_id')
                  event_id = body.get('event_id')
                  
                  if not user_id or not event_id:
                      return {
                          "statusCode": 400,
                          "body": json.dumps({"error": "Missing user_id or event_id"})
                      }
                  
                  # Construct the S3 object key
                  bucket_name = os.environ['EVENT_IMAGE_BUCKET']
                  file_key = f"{event_id}/tickets/{user_id}/image.png"
                  
                  # Generate a pre-signed URL valid for 1 minute
                  presigned_url = s3.generate_presigned_url(
                      'get_object',
                      Params={
                          'Bucket': bucket_name,
                          'Key': file_key
                      },
                      ExpiresIn=60
                  )
                  
                  return {
                      "statusCode": 200,
                      "body": json.dumps({"presigned_url": presigned_url})
                  }
              except Exception as e:
                  return {
                      "statusCode": 500,
                      "body": json.dumps({"error": str(e)})
                  }
      Environment:
        Variables:
          EVENT_IMAGE_BUCKET: !Ref EventBucket
      Timeout: 10
  
  # Grant permission for API Gateway to invoke the Lambda function
  LambdaPresignedUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt TicketPresignedUrlLambdaFunction.Arn
      Action: "lambda:InvokeFunction"
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*"

  # API Gateway and associated resources
  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties: 
      Name: !Sub "${Prefix}-${Env}-api"
      Description: API Gateway for managing serverless features
      EndpointConfiguration:
        Types: 
          - REGIONAL

  # '/subscribe' resource path
  SubscribeResource:
    Type: AWS::ApiGateway::Resource
    Properties: 
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: 'subscribe'

  # '/subscribe' POST method
  SubscribeMethodPost:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref SubscribeResource
      HttpMethod: POST
      ApiKeyRequired: true
      AuthorizationType: NONE
      RequestParameters:
        method.request.querystring.email: true
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:states:action/StartSyncExecution"
        Credentials: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Role}"
        RequestTemplates:
          application/json: !Sub |
            {
              "stateMachineArn": "${StateMachine}",
              "input": "{ \"email\": \"$input.params().querystring.get('email')\" }"
            }
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: |
                $input.path('$.output')
          - StatusCode: 400
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: |
                {
                  "error": "Bad Request",
                  "message": "$input.path('$.errorMessage')"
                }
            SelectionPattern: "Invalid.*"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
        - StatusCode: 400
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
  
  # '/subscribe' OPTIONS method for CORS preflight
  SubscribeMethodOptions:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref SubscribeResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: |
            {
              "statusCode": 200
            }
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

