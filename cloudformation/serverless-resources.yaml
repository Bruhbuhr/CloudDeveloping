AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  Prefix:
    Type: String
    Description: Prefix for naming resources
  Env:
    Type: String
    Description: Environment (e.g., dev, prod)

Resources:
  # Messaging/Notification
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub "Ticketery"
      FifoTopic: False
      Tags: 
        - Key: Name
          Value: !Sub "${Prefix}-${Env}-app-notification"
      TopicName: !Sub "${Prefix}-${Env}-app-notification"

  # SNS Topic Policy to allow access from LabRole
  SNSPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SNSTopic
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "__default_statement_ID",
              "Effect": "Allow",
              "Principal": {
                "AWS": "*"
              },
              "Action": [
                "SNS:GetTopicAttributes",
                "SNS:SetTopicAttributes",
                "SNS:AddPermission",
                "SNS:RemovePermission",
                "SNS:DeleteTopic",
                "SNS:Subscribe",
                "SNS:ListSubscriptionsByTopic",
                "SNS:Publish"
              ],
              "Resource": "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Prefix}-${Env}-app-notification",
              "Condition": {
                "StringEquals": {
                  "aws:SourceOwner": "${AWS::AccountId}"
                }
              }
            },
            {
              "Effect": "Allow",
              "Principal": {
                "Service": [
                  "states.amazonaws.com",
                  "lambda.amazonaws.com"
                ]
              },
              "Action": [
                "SNS:GetTopicAttributes",
                "SNS:SetTopicAttributes",
                "SNS:AddPermission",
                "SNS:RemovePermission",
                "SNS:DeleteTopic",
                "SNS:Subscribe",
                "SNS:ListSubscriptionsByTopic",
                "SNS:Publish"
              ],
              "Resource": "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Prefix}-${Env}-app-notification"
            }
          ]
        }

  # Step Functions State Machine for SNS subscription with email validation
  StepFunctionsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${Prefix}-${Env}-sns-subscription"
      RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/asm-LabRole"
      DefinitionString: !Sub |
        {
          "Comment": "State Machine to handle SNS subscription",
          "StartAt": "ValidateInput",
          "States": {
            "ValidateInput": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.email",
                  "StringMatches": "*@*.*",
                  "Next": "SendSubscriptionEmail"
                }
              ],
              "Default": "InvalidInput"
            },
            "SendSubscriptionEmail": {
              "Type": "Task",
              "Parameters": {
                "Protocol": "EMAIL",
                "Endpoint.$": "$.email",
                "TopicArn": "${SNSTopic}"
              },
              "Resource": "arn:aws:states:::aws-sdk:sns:subscribe",
              "End": true
            },
            "InvalidInput": {
              "Type": "Fail",
              "Error": "InvalidInputError",
              "Cause": "Invalid email address provided."
            }
          }
        }

  # Lambda function to send OTP
  OTPLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Prefix}-${Env}-send-otp"
      Runtime: python3.9
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/asm-LabRole"
      Handler: index.lambda_handler
      Code:
        ZipFile: |
          import boto3
          import json
          import os

          sns = boto3.client('sns')

          def lambda_handler(event, context):
              try:
                  body = json.loads(event['body'])
                  email = body.get('email')
                  otp = body.get('otp')

                  if not email or not otp:
                      return {
                          "statusCode": 400,
                          "headers": {
                              "Access-Control-Allow-Origin": "*"
                          },
                          "body": json.dumps({"error": "Missing email or otp in request"})
                      }

                  message = f"Your OTP is: {otp}"
                  response = sns.publish(
                      TopicArn=os.environ['SNS_TOPIC_ARN'],
                      Message=message,
                      Subject="Your OTP Code",
                      MessageAttributes={
                          'email': {
                              'DataType': 'String',
                              'StringValue': email
                          }
                      }
                  )

                  return {
                      "statusCode": 200,
                      "headers": {
                          "Access-Control-Allow-Origin": "*"
                      },
                      "body": json.dumps({"message": "OTP sent successfully", "response": response})
                  }
              except Exception as e:
                  return {
                      "statusCode": 500,
                      "headers": {
                          "Access-Control-Allow-Origin": "*"
                      },
                      "body": json.dumps({"error": str(e)})
                  }
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref SNSTopic
      Timeout: 10

  # Grant SNS publish permissions to the Lambda function
  LambdaSNSTopicPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt OTPLambdaFunction.Arn
      Action: "lambda:InvokeFunction"
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*"

  # API Gateway and associated resources
  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties: 
      Name: !Sub "${Prefix}-${Env}-api"
      Description: API Gateway for managing serverless features
      EndpointConfiguration:
        Types: 
          - REGIONAL

  # '/subscribe' resource path
  SubscribeResource:
    Type: AWS::ApiGateway::Resource
    Properties: 
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: 'subscribe'

  # '/subscribe' POST method
  SubscribeMethodPost:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref SubscribeResource
      HttpMethod: POST
      ApiKeyRequired: true
      AuthorizationType: NONE
      RequestParameters:
        method.request.querystring.email: true
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:states:action/StartExecution"
        Credentials: !Sub "arn:aws:iam::${AWS::AccountId}:role/asm-LabRole"
        RequestTemplates:
          application/json: !Sub |
            {
              "stateMachineArn": "${StepFunctionsStateMachine}",
              "input": "{ \"email\": \"$input.params().querystring.get('email')\" }"
            }
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: |
                {
                  "message": "Execution started successfully",
                  "executionArn": "$input.path('$.executionArn')"
                }
          - StatusCode: 400
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: |
                {
                  "error": "Bad Request",
                  "message": "$input.path('$.errorMessage')"
                }
            SelectionPattern: "Invalid.*"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
        - StatusCode: 400
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
  
  # '/subscribe' OPTIONS method for CORS preflight
  SubscribeMethodOptions:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref SubscribeResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: |
            {
              "statusCode": 200
            }
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # '/otp' resource path
  OTPResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: 'otp'

  # '/otp' POST method
  OTPMethodPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref OTPResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OTPLambdaFunction.Arn}/invocations"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
        - StatusCode: 400
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
        - StatusCode: 500
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # '/otp' OPTIONS method for CORS preflight
  OTPMethodOptions:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref OTPResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: |
            {
              "statusCode": 200
            }
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Update Deployment to include '/otp'
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - SubscribeMethodPost
      - SubscribeMethodOptions
      - OTPMethodPost
      - OTPMethodOptions
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      StageName: !Ref Env

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - ApiDeployment
    Properties:
      Description: Usage Plan for API Gateway
      ApiStages:
        - ApiId: !Ref ApiGatewayRestApi
          Stage: !Ref Env
          Throttle:
            "/subscribe/POST": 
              RateLimit: 50.0
              BurstLimit: 100
            "/otp/POST":
              RateLimit: 20.0
              BurstLimit: 50
      Quota:
        Limit: 1000
        Period: MONTH
      Throttle:
        RateLimit: 100.0
        BurstLimit: 200
      UsagePlanName: !Sub "${Prefix}-${Env}-usage-plan"

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties: 
      Description: API Key
      Name: !Sub "${Prefix}-${Env}-api-key"
      Enabled: True
      
  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}"
    Description: Endpoint for the subscribe resource
